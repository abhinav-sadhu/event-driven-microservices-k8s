spring.application.name=order-service

# --- Kafka Configuration (Aiven) ---
spring.kafka.bootstrap-servers=kafka-myhome-abhinav570-c36c.e.aivencloud.com:17601

#spring.kafka.bootstrap-servers=kafka-myhome-abhinav570-c36c.e.aivencloud.com:17612
# SASL Security Protocol
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="avnadmin" password="${KAFKA_PASSWORD}";

spring.kafka.ssl.trust-store-type=PEM
spring.kafka.ssl.trust-store-location=file:/app/certs/ca.pem

#spring.kafka.ssl.trust-store-location=classpath:certs/ca.pem

# OAuth 2.0 Security Configuration (Auth0)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-551b5abegk4yaspx.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://ecommerce-api.abhinav.com

server.port=8082