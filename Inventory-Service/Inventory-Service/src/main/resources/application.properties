spring.application.name=Inventory-Service

# --- PostgreSQL Configuration (Neon) ---
spring.datasource.url=jdbc:postgresql://ep-old-voice-aza6meoa-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=<YOUR_NEON_DB_PASSWORD>
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Kafka Configuration (Aiven) ---
#spring.kafka.bootstrap-servers=kafka-myhome-abhinav570-c36c.e.aivencloud.com:17601

spring.kafka.bootstrap-servers=kafka-myhome-abhinav570-c36c.e.aivencloud.com:17612
# SASL Security Protocol
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="avnadmin" password="<YOUR_KAFKA_PASSWORD>";

spring.kafka.ssl.trust-store-type=PEM
spring.kafka.ssl.trust-store-location=file:/app/certs/ca.pem
#spring.kafka.ssl.trust-store-location=classpath:certs/ca.pem

server.port=8083